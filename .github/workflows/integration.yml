name: Server-agent integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: TimeWeaver-Agent
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: horrible-gh/TimeWeaver
          ref: main
          path: TimeWeaver
          persist-credentials: false
      - name: Preserve exact validation sources
        run: |
          git -C TimeWeaver-Agent rev-parse HEAD > agent-revision.txt
          git -C TimeWeaver rev-parse HEAD > server-revision.txt
          tar --exclude=.git -czf validation-sources.tar.gz TimeWeaver TimeWeaver-Agent agent-revision.txt server-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validation-sources
          path: validation-sources.tar.gz
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Prepare Python test dependencies
        run: |
          python -m pip download -d wheels -r TimeWeaver/server/requirements.txt apscheduler==3.11.0 requests==2.32.4 pytest
          python -m pip install --no-index --find-links wheels -r TimeWeaver/server/requirements.txt apscheduler==3.11.0 requests==2.32.4 pytest
      - uses: actions/upload-artifact@v4
        with:
          name: python-test-dependencies
          path: wheels/
          retention-days: 1
      - name: Server regression tests and snapshot export
        working-directory: TimeWeaver
        env:
          TIMEWEAVER_CONTRACT_SNAPSHOT: ${{ github.workspace }}/housekeep-contract.json
        run: python -m pytest server/tests -q
      - name: Legacy agent regression tests
        if: ${{ !cancelled() }}
        working-directory: TimeWeaver
        run: python -m pytest agent/tests -q
      - name: Client tests and production build
        if: ${{ !cancelled() }}
        working-directory: TimeWeaver/client
        run: |
          node --test tests/*.test.mjs
          npm ci
          npm run build
      - name: Go agent and server snapshot contract
        if: ${{ !cancelled() }}
        working-directory: TimeWeaver-Agent
        env:
          TIMEWEAVER_CONTRACT_SNAPSHOT: ${{ github.workspace }}/housekeep-contract.json
        run: |
          test -s "$TIMEWEAVER_CONTRACT_SNAPSHOT"
          go test -race ./...
          go vet ./...
